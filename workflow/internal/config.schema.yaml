$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Schema for user-provided configuration files."
type: object
additionalProperties: false
properties:
  year_start:
    description: Start year (global setting passed to all modules)
    type: number
  year_end:
    description: End year (global setting passed to all modules)
    type: number
  temporal_resolution:
    description: Temporal resolution (global setting passed to all modules)
    type: string
